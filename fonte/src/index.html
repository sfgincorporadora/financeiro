<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFG Financeiro</title>
<meta name="theme-color" content="#0B2046">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SFG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --navy:#0B2046;--navy-2:#23477F;--bg:#F3F5F9;--card:#fff;--ink:#0F1B2D;--muted:#5B6B82;--line:#E1E6EF;--chip:#EEF1F6;
  --in:#1F7A57;--out:#B3261E;--out-soft:rgba(179,38,30,.35);--bal:#23477F;--pend:#D5DCE7;--ok-bg:#E3F3EC;--warn:#8A5300;--warn-bg:#FFF4E0;--bad-bg:#FBE4E1;--steel:#8FA6C9;
  --r:12px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --navy:#2F5BA3;--navy-2:#16294A;--bg:#0E1420;--card:#161E2D;--ink:#E6EBF3;--muted:#9AA7BA;--line:#2A3446;--chip:#22304A;
  --in:#4CC39C;--out:#EE7A6E;--out-soft:rgba(238,122,110,.4);--bal:#8FB4F0;--steel:#5B76A3;--pend:#3A465B;--ok-bg:#173A30;--warn:#F2C278;--warn-bg:#3A2A10;--bad-bg:#40201C;
}}:root[data-theme=dark]{
  --navy:#2F5BA3;--navy-2:#16294A;--bg:#0E1420;--card:#161E2D;--ink:#E6EBF3;--muted:#9AA7BA;--line:#2A3446;--chip:#22304A;
  --in:#4CC39C;--out:#EE7A6E;--out-soft:rgba(238,122,110,.4);--bal:#8FB4F0;--steel:#5B76A3;--pend:#3A465B;--ok-bg:#173A30;--warn:#F2C278;--warn-bg:#3A2A10;--bad-bg:#40201C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pos{color:var(--in)}.neg{color:var(--out)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.logo{width:38px;height:38px;border:2px solid currentColor;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;flex:none}
.logo.big{width:64px;height:64px;font-size:20px;border-radius:14px;color:var(--navy);margin:0 auto 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo.big{color:var(--ink)}}:root[data-theme=dark] .logo.big{color:var(--ink)}
.login{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;padding:28px 22px}
.login h1{margin:4px 0 0;font-size:21px}.login p{margin:0}
.login label{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;color:var(--muted);font-weight:500}.login input{width:100%}
.erro{color:var(--out);min-height:1.2em;font-size:14px}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:#0B2046;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:24px 14px 14px;overflow-y:auto}
.side .sec{font-size:10.5px;letter-spacing:.14em;color:#8EA0BD;padding:16px 12px 6px;font-weight:600}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 8px}
.brand .logo-img{height:40px;width:auto;display:block}
.brand b{display:block;font-size:15px}.brand small{opacity:.7;font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;color:#C9D3E4;font-size:14px}
.side nav a:hover{background:rgba(255,255,255,.08)}
.side nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:8px;font-size:12px;word-break:break-all}.side-foot .muted{color:rgba(255,255,255,.6)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:20px 32px 14px;border-bottom:1px solid var(--line)}
.top .tlogo{display:none}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{padding:22px 32px 48px;max-width:1320px;width:100%;margin:0 auto}
.bottom,.fab{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--in)}
.sync.pend i{background:#E2A23B}.sync.off i{background:var(--muted)}
@media (max-width:820px){
  .side,.desk{display:none!important}
  .top{padding:calc(10px + var(--safe-t)) 16px 10px;background:#0B2046;color:#fff;border:0}
  .top h1{font-size:18px}.top .tlogo{display:block;height:26px;width:auto}.top .sync{color:rgba(255,255,255,.8)}.top .sync span{max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .top .icon-btn{color:#fff}
  .view{padding:12px 12px calc(96px + var(--safe-b))}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--safe-b))}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
  .bottom a.on{color:var(--navy);font-weight:600}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bottom a.on{color:var(--bal)}:root:not([data-theme=light]) .top{background:#0F1A2E;border-bottom:1px solid var(--line)}}:root[data-theme=dark] .bottom a.on{color:var(--bal)}:root[data-theme=dark] .top{background:#0F1A2E;border-bottom:1px solid var(--line)}
  .tr>.btn{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(74px + var(--safe-b));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
}
/* cards, grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;margin-bottom:14px}
.card h2{font-size:16px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-weight:400;color:var(--muted);font-size:12.5px}
.card h2 .btn{margin-left:auto}
.grid{display:grid;gap:14px}.grid>.card{margin-bottom:0}
.grid+.card,.grid+.grid,.card+.grid{margin-top:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:14px}
.two{grid-template-columns:1fr 1fr}.lg{grid-template-columns:3fr 2fr}
@media (max-width:1000px){.two,.lg{grid-template-columns:1fr}}
.kpi .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
.kpi.hero{background:#0B2046;border-color:#0B2046;color:#fff}.kpi.hero .lab,.kpi.hero .sub{color:#B9C6DC}.kpi.hero .val{color:#fff}
.kpi .val{font-size:24px;letter-spacing:-.01em;font-weight:700;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--muted)}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:11px 12px}.kpi .val{font-size:17px}.kpi .sub{font-size:11px}}
.chartbox{position:relative;height:260px}.chartbox.tall{height:380px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.empty{text-align:center;padding:30px}
.loading{padding:40px;text-align:center;color:var(--muted)}
/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--out);border-color:var(--out)}
.btn.link{border:0;background:none;color:var(--bal);padding:6px 4px}
.btn.sm{padding:4px 10px;font-size:13px}.btn.full{width:100%}
.btn.on{background:var(--chip)}
.btn.file{position:relative}
.btn:disabled{opacity:.6}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg.full{display:flex}.seg.full button{flex:1}
.seg button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.acts.left{justify-content:flex-start}.acts.wrap{justify-content:flex-start}
/* filters */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.filtros input[type=search]{flex:1 1 220px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 10px;font-size:16px;min-width:0;max-width:100%}
.filtros select,.filtros input{font-size:14.5px;padding:7px 9px}
@media (max-width:820px){.filtros select,.filtros input{font-size:16px;flex:1 1 140px}}
/* lists */
.ltot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);align-items:center}
.ltot b{color:var(--ink)}
.tlist{display:flex;flex-direction:column}
.mhead{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 4px 4px;font-weight:600}
.tr{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tr:hover{background:var(--chip)}
.tr.sel{background:var(--chip)}
.td-date{width:44px;flex:none;text-align:center;line-height:1.15}.td-date b{display:block;font-size:14px}.td-date small{font-size:11px;color:var(--muted)}
.td-main{flex:1;min-width:0}
.td-item{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.td-val b{white-space:nowrap}.td-val small{font-size:11.5px;white-space:nowrap}
.cb{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.tr.sel .cb{background:var(--navy);border-color:var(--navy)}
.selbar{position:sticky;bottom:calc(70px + var(--safe-b));z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.15);flex-wrap:wrap}
@media (min-width:821px){.selbar{bottom:16px}}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--in)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--out)}
.chip .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:0 0 0 2px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pad{padding:16px 4px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .side{background:#0F1A2E!important;border-right:1px solid var(--line)}:root:not([data-theme=light]) .kpi.hero{background:#1E3A66;border-color:#2F5BA3}:root:not([data-theme=light]) .alerta-caixa a{color:var(--warn)}:root:not([data-theme=light]) .btn.link{color:var(--bal)}}:root[data-theme=dark] .side{background:#0F1A2E!important;border-right:1px solid var(--line)}:root[data-theme=dark] .kpi.hero{background:#1E3A66;border-color:#2F5BA3}:root[data-theme=dark] .alerta-caixa a{color:var(--warn)}:root[data-theme=dark] .btn.link{color:var(--bal)}
.brand b{display:block;font-size:15px;letter-spacing:.05em}.brand small{font-size:9.5px;letter-spacing:.22em;color:#B9C6DC}
.saud{font-size:26px;margin:2px 0 18px;letter-spacing:-.01em}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:1000px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.qbar{color:inherit;border-radius:6px}a.qbar:hover{background:var(--chip)}
.menu-item{display:flex;gap:12px;align-items:center;padding:14px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:15.5px}
pre.regras{background:var(--bg);border-radius:10px;padding:12px;font-size:11.5px;overflow-x:auto;white-space:pre}
.login-logo{width:200px;height:auto;margin:0 auto 4px;display:block}
body.ro .rw{display:none!important}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.alerta-caixa{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--warn-bg);border:1px solid #F1D9A8;color:#6B4100;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .alerta-caixa{border-color:#5A4318;color:var(--warn)}}:root[data-theme=dark] .alerta-caixa{border-color:#5A4318;color:var(--warn)}
.alerta-caixa span{flex:1 1 300px}
.qbar{display:grid;grid-template-columns:34px minmax(0,1fr) 96px;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.qbar .bar{width:100%;height:8px}.qbar .bar i{background:var(--bal)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--chip);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:120px;max-height:620px;overflow-y:auto}
.kcol h3{font-size:13px;margin:4px 4px 0;display:flex;justify-content:space-between;gap:6px}
.kcol .ktot{font-size:12px;color:var(--muted);padding:0 4px}
.kcard{font:inherit;color:inherit;text-align:left;width:100%;background:var(--card);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:none;cursor:pointer;border:1px solid transparent;box-shadow:0 1px 2px rgba(11,32,70,.06)}
.kcard:hover{border-color:var(--pend)}
.kcard b{font-size:13.5px;white-space:nowrap}.kcard small{font-size:12px;color:var(--muted)}
.dia{display:inline-block;width:9px;height:9px;transform:rotate(45deg);background:var(--c,var(--in));flex:none}
.ftbl td.st{white-space:nowrap}
.gant{display:grid;grid-template-columns:repeat(var(--n),minmax(18px,1fr));height:24px;align-items:center;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat;min-width:300px}
.gant span{display:flex;justify-content:center}
.dual{display:flex;flex-direction:column;gap:5px;min-width:180px}
.dual .bar{width:100%;height:8px}
@media print{.side,.bottom,.fab,.top button,.no-print{display:none!important}.view{padding:0}.card{break-inside:avoid}}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}.tgl input{width:18px;height:18px}
.tr.grp .td-item .chip{font-weight:500;vertical-align:1px}
/* tables */
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tbl .l{text-align:left}.tbl td.wrap{white-space:normal;min-width:200px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover{background:var(--chip)}
.tbl tr.sec td{background:var(--bg);font-weight:700;text-align:left}
.tbl tr.tot td{font-weight:700}
.pbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{display:inline-block;width:70px;height:7px;border-radius:9px;background:var(--pend);overflow:hidden}
.bar i{display:block;height:100%;background:var(--in)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.cl th{vertical-align:bottom;padding:6px 3px}
.cl th span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:170px;text-transform:none;letter-spacing:0;font-size:11.5px}
.cl td{text-align:center;padding:3px}
.matriz{max-height:70vh;overflow:auto}
.dot{width:24px;height:24px;border-radius:50%;border:0;background:var(--pend);cursor:pointer;padding:0}
.dot.y{background:var(--in)}
.kv{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted);min-width:100px}.kv b{flex:1;word-break:break-all}
.menu a{display:flex;gap:12px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px}.menu a:last-child{border:0}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,18,32,0);display:flex;align-items:center;justify-content:center;transition:background .18s}
.sheet-wrap.in{background:rgba(10,18,32,.5)}.sheet-wrap.out{background:rgba(10,18,32,0)}
.sheet{background:var(--card);border-radius:16px;width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;transform:translateY(16px);opacity:0;transition:.18s}
.sheet.wide{width:min(900px,96vw)}
.sheet-wrap.in .sheet{transform:none;opacity:1}.sheet-wrap.out .sheet{transform:translateY(16px);opacity:0}
.sheet header{display:flex;align-items:center;padding:14px 16px 6px}.sheet header h2{flex:1;margin:0;font-size:17px}
.sheet-body{padding:6px 16px 16px;overflow:auto}
@media (max-width:820px){.sheet-wrap{align-items:flex-end}.sheet{width:100%;border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:var(--safe-b)}}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.form label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14.5px;color:var(--ink)}
.form label.chk input{width:20px;height:20px}
.form input,.form select,.form textarea{color:var(--ink);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.lbl{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pick{display:inline-flex!important;flex-direction:row!important}
.pick input{display:none}
.pick span{display:inline-block;min-width:38px;text-align:center;padding:6px 8px;border-radius:8px;border:1px solid var(--line);color:var(--ink);font-size:14px;cursor:pointer}
.pick input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.preview:empty{display:none}
.resumo{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:6px}
.resumo .big{font-size:24px;font-weight:700;margin:4px 0}

/* Início: extrato com linha d'água */
.extrato-hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 30px 8px;margin-bottom:18px}

.agua{position:relative;height:180px;margin:14px 0 34px}
.agua svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;clip-path:inset(0 100% 0 0);animation:revela 1.3s cubic-bezier(.3,.1,.2,1) .1s forwards}
.agua-pos{fill:var(--bal);opacity:.10}.agua-neg{fill:var(--out);opacity:.16}
.agua-linha{fill:none;stroke:var(--bal);stroke-width:2;stroke-linejoin:round}
.agua-zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.agua-zero-lab{position:absolute;right:0;transform:translateY(-130%);font-size:11.5px;color:var(--muted)}
.agua-ponto{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--out);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--card);opacity:0;animation:aparece .3s ease-out 1.3s forwards}
.agua-nota{position:absolute;transform:translate(12px,6px);font-size:12.5px;white-space:nowrap;background:var(--card);padding:1px 6px;border-radius:4px;color:var(--muted);opacity:0;animation:aparece .3s ease-out 1.4s forwards}

@keyframes revela{to{clip-path:inset(0 0 0 0)}}

@media (prefers-reduced-motion:reduce){.agua svg{animation:none;clip-path:none}.agua-ponto,.agua-nota{animation:none;opacity:1}.sheet,.sheet-wrap{transition:none!important}}
